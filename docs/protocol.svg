<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8681"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#fbfbfa"/>

  <text x="40" y="42" font-size="16" font-weight="700" fill="#1a1a1a">The control loop</text>
  <text x="40" y="64" font-size="12.5" fill="#6b6b6b">Claude does not decide which stage comes next. It asks. The order is not persuasion — it is control flow.</text>

  <!-- 1 -->
  <rect x="40" y="96" width="188" height="96" rx="9" fill="#eff5ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="62" cy="118" r="10" fill="#2563eb"/>
  <text x="62" y="122" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="80" y="123" font-size="13.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a1a1a">gw next</text>
  <text x="58" y="150" font-size="11.5" fill="#4a4a4a">The CLI reads state.json and</text>
  <text x="58" y="167" font-size="11.5" fill="#4a4a4a">returns the directive:</text>
  <text x="58" y="183" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6b6b6b">{stage, actor, inputs, gate}</text>

  <line x1="230" y1="144" x2="268" y2="144" stroke="#8a8681" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 2 -->
  <rect x="270" y="96" width="188" height="96" rx="9" fill="#f5f0ff" stroke="#7c3aed" stroke-width="1.5"/>
  <circle cx="292" cy="118" r="10" fill="#7c3aed"/>
  <text x="292" y="122" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="310" y="123" font-size="13.5" font-weight="600" fill="#1a1a1a">Claude works</text>
  <text x="288" y="150" font-size="11.5" fill="#4a4a4a">The creative part only: reads</text>
  <text x="288" y="167" font-size="11.5" fill="#4a4a4a">the IR, writes the component</text>
  <text x="288" y="184" font-size="11.5" fill="#4a4a4a">the way this repo writes them.</text>

  <line x1="460" y1="144" x2="498" y2="144" stroke="#8a8681" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 3 -->
  <rect x="500" y="96" width="188" height="96" rx="9" fill="#eff5ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="522" cy="118" r="10" fill="#2563eb"/>
  <text x="522" y="122" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="540" y="123" font-size="13.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a1a1a">gw verify</text>
  <text x="518" y="150" font-size="11.5" fill="#4a4a4a">Renders and measures the</text>
  <text x="518" y="167" font-size="11.5" fill="#4a4a4a">three dimensions on every</text>
  <text x="518" y="184" font-size="11.5" fill="#4a4a4a">viewport. Worst one wins.</text>

  <line x1="690" y1="144" x2="728" y2="144" stroke="#8a8681" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 4 -->
  <rect x="730" y="96" width="130" height="96" rx="9" fill="#ffffff" stroke="#d9d7d2" stroke-width="1.5"/>
  <circle cx="752" cy="118" r="10" fill="#8a8681"/>
  <text x="752" y="122" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="770" y="123" font-size="13.5" font-weight="600" fill="#1a1a1a">score</text>
  <text x="748" y="152" font-size="12" fill="#16a34a">≥ 90  →  advance</text>
  <text x="748" y="176" font-size="12" fill="#d97706">&lt; 90  →  refine</text>

  <!-- feedback -->
  <path d="M795 194 L795 232 L364 232 L364 196" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#r)"/>
  <rect x="452" y="216" width="256" height="32" rx="6" fill="#fff7ec" stroke="#f0d9b5" stroke-width="1"/>
  <text x="580" y="237" font-size="11.5" fill="#8a5a10" text-anchor="middle">refine --focus=structural · hard cap of 4</text>

  <!-- state -->
  <rect x="40" y="278" width="820" height="80" rx="9" fill="#ffffff" stroke="#d9d7d2" stroke-width="1.5"/>
  <text x="64" y="306" font-size="13" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a1a1a">.gridwright/runs/&lt;id&gt;/state.json</text>
  <text x="64" y="328" font-size="12" fill="#6b6b6b">The single source of truth. Survives interruptions, compaction and restarts.</text>
  <text x="64" y="347" font-size="12" fill="#6b6b6b">Closing a stage that is not the current one throws. The three mandatory ones cannot be skipped at all.</text>


  <text x="40" y="392" font-size="12.5" fill="#6b6b6b">There is no way to jump to <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a1a1a">golden</tspan> without passing, because the CLI will not allow it — not because the prompt asked nicely.</text>
</svg>
