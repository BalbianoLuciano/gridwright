<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8681"/>
    </marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#fbfbfa"/>

  <text x="40" y="42" font-size="16" font-weight="700" fill="#1a1a1a">Why the IR exists</text>
  <text x="40" y="64" font-size="12.5" fill="#6b6b6b">Feeding the raw tree to the model is not just expensive. It produces worse code.</text>

  <!-- raw -->
  <rect x="40" y="96" width="248" height="150" rx="9" fill="#ffffff" stroke="#d9d7d2" stroke-width="1.5"/>
  <text x="64" y="124" font-size="13.5" font-weight="600" fill="#1a1a1a">Raw Figma tree</text>
  <text x="64" y="150" font-size="12" fill="#6b6b6b">2,000–5,000 nodes</text>
  <text x="64" y="170" font-size="12" fill="#6b6b6b">absolute coordinates</text>
  <text x="64" y="190" font-size="12" fill="#6b6b6b">nested fills, constraints, effects</text>
  <text x="64" y="220" font-size="19" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a1a1a">~312 KB</text>

  <!-- distill -->
  <path d="M292 171 L332 171" stroke="#8a8681" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="336" y="140" width="130" height="62" rx="9" fill="#eff5ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="401" y="167" font-size="13.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a1a1a" text-anchor="middle">distill</text>
  <text x="401" y="186" font-size="11" fill="#6b6b6b" text-anchor="middle">deterministic</text>
  <path d="M470 171 L510 171" stroke="#8a8681" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- IR -->
  <rect x="514" y="96" width="248" height="150" rx="9" fill="#f2fbf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="538" y="124" font-size="13.5" font-weight="600" fill="#1a1a1a">The IR</text>
  <text x="538" y="150" font-size="12" fill="#4a4a4a">~120 lines, semantic</text>
  <text x="538" y="170" font-size="12" fill="#4a4a4a">roles, slots, resolved layout</text>
  <text x="538" y="190" font-size="12" fill="#4a4a4a">this is what the model reads</text>
  <text x="538" y="220" font-size="19" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#16a34a">~4 KB</text>

  <text x="786" y="164" font-size="26" font-weight="700" fill="#16a34a">99%</text>
  <text x="786" y="184" font-size="11.5" fill="#6b6b6b">smaller</text>

  <!-- isomorphisms -->
  <rect x="40" y="278" width="418" height="106" rx="9" fill="#ffffff" stroke="#d9d7d2" stroke-width="1.5"/>
  <text x="64" y="304" font-size="12.5" font-weight="600" fill="#1a1a1a">Two isomorphisms, not heuristics</text>
  <text x="64" y="330" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#2563eb">auto-layout</text>
  <text x="154" y="330" font-size="12" fill="#6b6b6b">→</text>
  <text x="174" y="330" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#2563eb">flex-col gap-6</text>
  <text x="64" y="350" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#2563eb">variants</text>
  <text x="154" y="350" font-size="12" fill="#6b6b6b">→</text>
  <text x="174" y="350" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#2563eb">props</text>
  <text x="64" y="372" font-size="11.5" fill="#6b6b6b">Side effect: it cannot emit margins between siblings.</text>

  <!-- halt -->
  <rect x="478" y="278" width="382" height="106" rx="9" fill="#fef6f6" stroke="#f0bcbc" stroke-width="1.5"/>
  <text x="502" y="304" font-size="12.5" font-weight="600" fill="#1a1a1a">No auto-layout → it halts</text>
  <text x="502" y="332" font-size="11.5" fill="#6b6b6b">If the design was positioned by hand there is no</text>
  <text x="502" y="349" font-size="11.5" fill="#6b6b6b">layout to infer. A better prompt will not fix that.</text>
  <text x="502" y="370" font-size="11.5" font-weight="600" fill="#b91c1c">It gets fixed in Figma.</text>
</svg>
